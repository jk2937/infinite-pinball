<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Infinite Pinball</title>
<style>
  html,body{margin:0;height:100%;background:#07070f;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#eef}
  canvas{display:block;width:100vw;height:100vh}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,5,15,.78);text-align:center;padding:16px;cursor:pointer}
  #overlay h1{font-size:clamp(32px,8vw,64px);margin:0 0 8px;color:#6ff;text-shadow:0 0 18px #0ff}
  #overlay p{margin:6px 0;opacity:.9;max-width:520px}
  .k{display:inline-block;border:1px solid #6ff;border-radius:4px;padding:0 6px;margin:0 2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>INFINITE PINBALL</h1>
  <p id="msg">Every world is different. Break through the blocks to climb higher.</p>
  <p>Flippers: <span class="k">←</span>/<span class="k">Z</span> left, <span class="k">→</span>/<span class="k">/</span> right, or tap left/right half of the screen.<br><span class="k">Space</span> nudges the table.</p>
  <p><b>Click, tap or press any key to start</b></p>
</div>
<script>
"use strict";
// ---------- constants ----------
const W = 600;          // table width (world units)
const LH = 1400;        // height of one level
const BR = 10;          // ball radius
const SPEED_CAP = 2600;

const NEW_ELEMENTS = {
  1: "Moving bumpers",
  2: "Spinners",
  3: "Gravity wells & armored blocks",
  4: "Sliding gates",
  5: "Repulsors",
  6: "Kicker walls",
  8: "Double-armored blocks",
};

// ---------- utils ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ---------- state ----------
let seed, levels, ball, score, balls, maxLevel, time, best, banner, over, started, nudges, stillTime;
const keys = {left:false, right:false};
try { best = +localStorage.getItem("ipb_best") || 0; } catch(e){ best = 0; }

function newGame(){
  seed = (Math.random()*1e9)|0;
  levels = [];
  score = 0; balls = 3; maxLevel = 0; time = 0; over = false; nudges = 0; stillTime = 0;
  banner = {text:"LEVEL 1", sub:"Break the blocks to climb!", t:3};
  spawnBall();
}

function spawnBall(){
  const base = maxLevel*LH;
  ball = {x:190, y:base+230, vx:0, vy:0, r:BR};
}

// ---------- level generation ----------
function getLevel(n){
  if (levels[n]) return levels[n];
  const R = mulberry32(seed ^ (n*2654435761));
  const rnd=(a,b)=>a+R()*(b-a);
  const base = n*LH;
  const lv = {n, base, segs:[], moving:[], flippers:[], bumpers:[], blocks:[], wells:[], hue:(n*47+200)%360};

  // --- lower flipper zone ---
  const flen = Math.max(74, 96 - n*2);
  const lpx = W/2 - 120, rpx = W/2 + 120, fy = base + 110;
  lv.segs.push({x1:0,y1:base+290,x2:lpx,y2:fy,t:4,oneWay:true});
  lv.segs.push({x1:W,y1:base+290,x2:rpx,y2:fy,t:4,oneWay:true});
  lv.flippers.push(makeFlipper(lpx,fy,flen,1), makeFlipper(rpx,fy,flen,-1));

  // --- upper flipper zone ---
  const uy = base + 680, ulen = Math.max(58, 72 - n*1.5);
  const ulx = W/2 - 85, urx = W/2 + 85;
  lv.segs.push({x1:ulx-90,y1:uy+85,x2:ulx,y2:uy,t:4,oneWay:true});
  lv.segs.push({x1:urx+90,y1:uy+85,x2:urx,y2:uy,t:4,oneWay:true});
  lv.flippers.push(makeFlipper(ulx,uy,ulen,1), makeFlipper(urx,uy,ulen,-1));

  // --- random contents in two regions ---
  const occupied = [];
  const free=(x,y,r)=>occupied.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+26);
  function place(r, y0, y1, x0=40, x1=W-40){
    for(let i=0;i<40;i++){
      const x=rnd(x0+r,x1-r), y=rnd(y0,y1);
      if(free(x,y,r)){occupied.push({x,y,r});return {x,y};}
    }
    return null;
  }
  const regions = [[base+330, base+580], [base+820, base+1130]];
  for (const [y0,y1] of regions){
    const nb = 2 + Math.floor(R()*2) + Math.floor(n/3);
    for(let i=0;i<Math.min(nb,6);i++){
      const r = rnd(18,30), p = place(r,y0,y1);
      if(!p) continue;
      const b = {x:p.x,y:p.y,r,bx:p.x,flash:0,amp:0,sp:0,ph:0,repel:false};
      if (n>=1 && R()<0.25+n*0.05){ b.amp=rnd(40,110); b.sp=rnd(0.6,1.6); b.ph=rnd(0,6); }
      b.bx = clamp(b.bx, r+b.amp+5, W-r-b.amp-5);
      lv.bumpers.push(b);
    }
    // deflector walls
    const nw = 1 + Math.floor(R()*2);
    for(let i=0;i<nw;i++){
      const p = place(45,y0,y1); if(!p) continue;
      const a = rnd(0,Math.PI), l = rnd(50,90);
      const kick = n>=6 && R()<0.5;
      lv.segs.push({x1:p.x-Math.cos(a)*l/2,y1:p.y-Math.sin(a)*l/2,x2:p.x+Math.cos(a)*l/2,y2:p.y+Math.sin(a)*l/2,t:5,kick});
    }
    // spinners
    if (n>=2 && R()<0.5+n*0.05){
      const p = place(50,y0,y1);
      if(p) lv.moving.push({type:"spin",cx:p.x,cy:p.y,len:rnd(70,100),ang:R()*6,w:rnd(1.2,2.5)*(R()<.5?-1:1),t:5});
    }
    // gravity wells / repulsors
    if (n>=3 && R()<0.35+n*0.04){
      const p = place(40,y0,y1);
      if(p) lv.wells.push({x:p.x,y:p.y,r:rnd(110,160),k:rnd(900,1500)*(n>=5&&R()<0.4?-1:1)});
    }
    // sliding gates
    if (n>=4 && R()<0.4+n*0.04){
      const gy = rnd(y0,y1);
      lv.moving.push({type:"gate",cy:gy,len:rnd(90,140),amp:rnd(120,200),sp:rnd(0.5,1.2),ph:R()*6,t:5});
    }
  }
  for (const m of lv.moving) updateMover(m,0,true);

  // --- block band at top ---
  const rows = Math.min(3 + Math.floor(n/2), 6), cols = 10, bw = W/cols;
  const top = base + 1310, bh = 22;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    let hp = 1 + Math.floor(R()*(1+n*0.5));
    if (n>=3 && R()<0.12) hp += 4;
    if (n>=8 && R()<0.08) hp += 8;
    hp = Math.min(hp, 16);
    lv.blocks.push({x:c*bw+2,y:top-(r+1)*(bh+3),w:bw-4,h:bh,hp,max:hp});
  }
  lv.blockBottom = top - rows*(bh+3);
  levels[n] = lv;
  return lv;
}

function makeFlipper(px,py,len,dir){
  const f = {px,py,len,dir,rest:-0.5,up:0.5,a:-0.5,tx:0,ty:0,ptx:0,pty:0};
  flipTip(f); f.ptx=f.tx; f.pty=f.ty; return f;
}
function flipTip(f){ f.tx = f.px + f.dir*f.len*Math.cos(f.a); f.ty = f.py + f.len*Math.sin(f.a); }

function updateMover(m, dt, init){
  m.px1=m.x1; m.py1=m.y1; m.px2=m.x2; m.py2=m.y2;
  if (m.type==="spin"){
    m.ang += m.w*dt;
    const c=Math.cos(m.ang)*m.len/2, s=Math.sin(m.ang)*m.len/2;
    m.x1=m.cx-c; m.y1=m.cy-s; m.x2=m.cx+c; m.y2=m.cy+s;
  } else {
    const cx = W/2 + Math.sin(time*m.sp+m.ph)*m.amp;
    m.x1=cx-m.len/2; m.x2=cx+m.len/2; m.y1=m.y2=m.cy;
  }
  if (init){ m.px1=m.x1; m.py1=m.y1; m.px2=m.x2; m.py2=m.y2; }
}

// ---------- physics ----------
function collideSeg(b,x1,y1,x2,y2,thick,e,v1x,v1y,v2x,v2y,oneWay){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy || 1;
  const t=clamp(((b.x-x1)*dx+(b.y-y1)*dy)/L2,0,1);
  const cx=x1+dx*t, cy=y1+dy*t;
  let nx=b.x-cx, ny=b.y-cy; const d=Math.hypot(nx,ny), R=b.r+thick;
  if (d>=R || d===0) return null;
  if (oneWay){
    let ux=-dy, uy=dx; if (uy<0){ux=-ux;uy=-uy;}
    if ((b.x-x1)*ux+(b.y-y1)*uy < 0) return null; // ball is below: pass through
  }
  nx/=d; ny/=d;
  const svx=v1x+(v2x-v1x)*t, svy=v1y+(v2y-v1y)*t;
  b.x=cx+nx*R; b.y=cy+ny*R;
  const vn=(b.vx-svx)*nx+(b.vy-svy)*ny;
  if (vn<0){ b.vx-=(1+e)*vn*nx; b.vy-=(1+e)*vn*ny; }
  return {nx,ny,vn};
}

function step(dt){
  time += dt;
  const b = ball;
  const cur = Math.max(0, Math.floor(b.y/LH));
  const near = [];
  for (let n=Math.max(0,cur-1); n<=cur+1; n++) near.push(getLevel(n));

  for (const lv of near){
    for (const f of lv.flippers){
      f.ptx=f.tx; f.pty=f.ty;
      const pressed = f.dir>0 ? keys.left : keys.right;
      const target = pressed ? f.up : f.rest, sp = pressed ? 26 : 14;
      f.a = f.a<target ? Math.min(target,f.a+sp*dt) : Math.max(target,f.a-sp*dt);
      flipTip(f);
    }
    for (const m of lv.moving) updateMover(m,dt,false);
    for (const bu of lv.bumpers){
      if (bu.amp) bu.x = bu.bx + Math.sin(time*bu.sp+bu.ph)*bu.amp;
      bu.flash = Math.max(0,bu.flash-dt*4);
    }
  }

  const G = Math.min(600*(1+cur*0.035), 900);
  b.vy -= G*dt;
  for (const lv of near) for (const w of lv.wells){
    const dx=w.x-b.x, dy=w.y-b.y, d=Math.hypot(dx,dy);
    if (d<w.r && d>1){ const f=w.k*(1-d/w.r)/d; b.vx+=dx*f*dt; b.vy+=dy*f*dt; }
  }
  const sp=Math.hypot(b.vx,b.vy);
  if (sp>SPEED_CAP){ b.vx*=SPEED_CAP/sp; b.vy*=SPEED_CAP/sp; }
  b.x+=b.vx*dt; b.y+=b.vy*dt;

  // side walls
  if (b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*0.6; }
  if (b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*0.6; }

  for (const lv of near){
    for (const s of lv.segs){
      const h = collideSeg(b,s.x1,s.y1,s.x2,s.y2,s.t,s.kick?0.2:0.45,0,0,0,0,s.oneWay);
      if (h && s.kick && h.vn<-100){ b.vx+=h.nx*700; b.vy+=h.ny*700; score+=10; }
    }
    for (const m of lv.moving){
      collideSeg(b,m.x1,m.y1,m.x2,m.y2,m.t,0.5,(m.x1-m.px1)/dt,(m.y1-m.py1)/dt,(m.x2-m.px2)/dt,(m.y2-m.py2)/dt,false);
    }
    for (const f of lv.flippers){
      collideSeg(b,f.px,f.py,f.tx,f.ty,7,0.25,0,0,(f.tx-f.ptx)/dt,(f.ty-f.pty)/dt,true);
    }
    for (const bu of lv.bumpers){
      const dx=b.x-bu.x, dy=b.y-bu.y, d=Math.hypot(dx,dy), R=b.r+bu.r;
      if (d<R && d>0){
        const nx=dx/d, ny=dy/d; b.x=bu.x+nx*R; b.y=bu.y+ny*R;
        const vn=b.vx*nx+b.vy*ny;
        if (vn<0){ b.vx-=2*vn*nx; b.vy-=2*vn*ny; }
        b.vx+=nx*520; b.vy+=ny*520;
        bu.flash=1; score+=100*(lv.n+1);
      }
    }
    for (let i=lv.blocks.length-1;i>=0;i--){
      const bl=lv.blocks[i];
      const cx=clamp(b.x,bl.x,bl.x+bl.w), cy=clamp(b.y,bl.y,bl.y+bl.h);
      let nx=b.x-cx, ny=b.y-cy, d=Math.hypot(nx,ny);
      if (d<b.r){
        if (d===0){ nx=0; ny=b.vy>0?-1:1; d=1; } else { nx/=d; ny/=d; }
        b.x=cx+nx*b.r; b.y=cy+ny*b.r;
        const vn=b.vx*nx+b.vy*ny;
        if (vn<0){ b.vx-=1.9*vn*nx; b.vy-=1.9*vn*ny; }
        bl.hp--; score+=50*(lv.n+1);
        if (bl.hp<=0) lv.blocks.splice(i,1);
      }
    }
  }

  // progress
  const reached = Math.floor((b.y-150)/LH);
  if (reached>maxLevel){
    maxLevel=reached; balls++; score+=1000*maxLevel;
    banner={text:"LEVEL "+(maxLevel+1), sub:(NEW_ELEMENTS[maxLevel]?"New: "+NEW_ELEMENTS[maxLevel]+"!  ":"")+"+1 ball", t:3};
    levels.forEach((l,i)=>{ if(i<maxLevel-2) levels[i]=null; }); // free old levels (unreachable)
    levels.length = Math.max(levels.length, maxLevel);
  }
  // stuck detection
  if (Math.hypot(b.vx,b.vy)<15) stillTime+=dt; else stillTime=0;
  if (stillTime>3){ b.vy+=500; b.vx+=(Math.random()-.5)*300; stillTime=0; }

  // drain
  if (b.y < maxLevel*LH - 40){
    balls--;
    if (balls<=0) return gameOver();
    banner={text:"BALL LOST", sub:balls+" left", t:1.5};
    spawnBall();
  }
}

function gameOver(){
  over=true;
  if (score>best){ best=score; try{localStorage.setItem("ipb_best",best);}catch(e){} }
  document.getElementById("msg").innerHTML =
    `<b>GAME OVER</b><br>Score ${score.toLocaleString()} · reached level ${maxLevel+1}<br>Best ${best.toLocaleString()}<br>A brand new world awaits.`;
  document.getElementById("overlay").style.display="flex";
}

// ---------- rendering ----------
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let cw, ch, scale, camY=0;
function resize(){
  const dpr=window.devicePixelRatio||1;
  cw=cv.width=innerWidth*dpr; ch=cv.height=innerHeight*dpr;
  scale=Math.min(cw/W, ch/820);
}
addEventListener("resize",resize); resize();

function draw(){
  const offX=(cw-W*scale)/2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#040409"; ctx.fillRect(0,0,cw,ch);
  ctx.setTransform(scale,0,0,-scale,offX,ch/2+camY*scale);
  const viewH=ch/scale/2;
  const lo=Math.max(0,Math.floor((camY-viewH)/LH)), hi=Math.floor((camY+viewH)/LH);
  for (let n=lo;n<=hi;n++){
    const lv=getLevel(n);
    // background
    ctx.fillStyle=`hsl(${lv.hue},35%,9%)`; ctx.fillRect(0,lv.base,W,LH);
    ctx.strokeStyle=`hsla(${lv.hue},60%,40%,.12)`; ctx.lineWidth=1;
    for (let y=lv.base;y<lv.base+LH;y+=50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    const accent=`hsl(${lv.hue},90%,65%)`;
    // wells
    for (const w of lv.wells){
      const g=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r);
      const col=w.k>0?"150,60,255":"255,120,40";
      g.addColorStop(0,`rgba(${col},.55)`); g.addColorStop(1,`rgba(${col},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,7); ctx.fill();
      ctx.strokeStyle=`rgba(${col},.6)`; ctx.setLineDash([6,6]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(w.x,w.y,w.r*(0.3+0.2*Math.sin(time*3)),0,7); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.lineCap="round";
    for (const s of lv.segs){
      ctx.strokeStyle=s.kick?"#ff5":accent; ctx.lineWidth=s.t*2;
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    }
    for (const m of lv.moving){
      ctx.strokeStyle=m.type==="spin"?"#f6f":"#6f9"; ctx.lineWidth=m.t*2;
      ctx.beginPath(); ctx.moveTo(m.x1,m.y1); ctx.lineTo(m.x2,m.y2); ctx.stroke();
      if (m.type==="spin"){ ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(m.cx,m.cy,4,0,7); ctx.fill(); }
    }
    for (const f of lv.flippers){
      ctx.strokeStyle="#fff"; ctx.lineWidth=14;
      ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(f.tx,f.ty); ctx.stroke();
      ctx.strokeStyle=accent; ctx.lineWidth=8; ctx.stroke();
    }
    for (const bu of lv.bumpers){
      ctx.fillStyle=bu.flash>0?"#fff":`hsl(${(lv.hue+180)%360},80%,${50+bu.flash*30}%)`;
      ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r+bu.flash*4,0,7); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r*0.55,0,7); ctx.stroke();
    }
    for (const bl of lv.blocks){
      const armored=bl.max>4;
      const l=armored?30+bl.hp/bl.max*20:45+bl.hp/bl.max*20;
      ctx.fillStyle=armored?`hsl(210,15%,${l}%)`:`hsl(${(lv.hue+bl.max*30)%360},80%,${l}%)`;
      ctx.fillRect(bl.x,bl.y,bl.w,bl.h);
      if (bl.hp>1){ ctx.save(); ctx.scale(1,-1); ctx.fillStyle="#000a"; ctx.font="bold 14px sans-serif";
        ctx.textAlign="center"; ctx.fillText(bl.hp,bl.x+bl.w/2,-bl.y-6); ctx.restore(); }
    }
    // level label
    ctx.save(); ctx.scale(1,-1); ctx.fillStyle=`hsla(${lv.hue},80%,70%,.25)`; ctx.font="bold 60px sans-serif";
    ctx.textAlign="center"; ctx.fillText("LEVEL "+(n+1),W/2,-(lv.base+450)); ctx.restore();
  }
  // drain line
  ctx.strokeStyle="rgba(255,60,60,.5)"; ctx.lineWidth=2; ctx.setLineDash([10,8]);
  ctx.beginPath(); ctx.moveTo(0,maxLevel*LH-40); ctx.lineTo(W,maxLevel*LH-40); ctx.stroke(); ctx.setLineDash([]);
  // ball
  const g=ctx.createRadialGradient(ball.x-3,ball.y+3,1,ball.x,ball.y,ball.r);
  g.addColorStop(0,"#fff"); g.addColorStop(1,"#99a");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
  // side rails
  ctx.fillStyle="#223"; ctx.fillRect(-20,camY-viewH,20,viewH*2); ctx.fillRect(W,camY-viewH,20,viewH*2);

  // HUD
  ctx.setTransform(1,0,0,1,0,0);
  const fs=Math.max(14,Math.min(22,cw/40));
  ctx.font=`bold ${fs}px system-ui,sans-serif`; ctx.fillStyle="#eef"; ctx.textAlign="left";
  ctx.fillText(`SCORE ${score.toLocaleString()}`,10,fs+6);
  ctx.fillText(`LEVEL ${maxLevel+1}   BALLS ${balls}`,10,fs*2+12);
  ctx.textAlign="right"; ctx.fillStyle="#aab";
  ctx.fillText(`BEST ${best.toLocaleString()}`,cw-10,fs+6);
  ctx.fillText(`WORLD #${seed}`,cw-10,fs*2+12);
  if (banner && banner.t>0){
    ctx.globalAlpha=Math.min(1,banner.t); ctx.textAlign="center";
    ctx.font=`bold ${fs*2.4}px system-ui,sans-serif`; ctx.fillStyle="#6ff";
    ctx.fillText(banner.text,cw/2,ch*0.3);
    ctx.font=`${fs}px system-ui,sans-serif`; ctx.fillStyle="#fff"; ctx.fillText(banner.sub,cw/2,ch*0.3+fs*1.8);
    ctx.globalAlpha=1;
  }
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,1/20); last=now;
  if (started && !over){
    const n=Math.ceil(dt/(1/720));
    for (let i=0;i<n && !over;i++) step(dt/n);
    if (banner) banner.t-=dt;
  }
  // camera: follow ball, keep look-ahead upward, never below the drain
  const target=Math.max(ball.y+120, maxLevel*LH-40+ch/scale/2*0.9);
  camY+=(target-camY)*Math.min(1,dt*6);
  draw();
  requestAnimationFrame(frame);
}

// ---------- input ----------
function start(){
  if (started && !over) return;
  document.getElementById("overlay").style.display="none";
  newGame(); camY=ball.y; started=true;
}
function nudge(){
  if (!started||over) return;
  ball.vx+=(Math.random()-.5)*250; ball.vy+=180; nudges++;
}
addEventListener("keydown",e=>{
  if (e.repeat) return;
  if (!started||over){ start(); return; }
  if (e.key==="ArrowLeft"||e.key==="z"||e.key==="Z"||e.key==="Shift"&&e.location===1) keys.left=true;
  if (e.key==="ArrowRight"||e.key==="/"||e.key==="m"||e.key==="M"||e.key==="Shift"&&e.location===2) keys.right=true;
  if (e.key===" ") nudge();
  e.preventDefault();
});
addEventListener("keyup",e=>{
  if (e.key==="ArrowLeft"||e.key==="z"||e.key==="Z"||e.key==="Shift"&&e.location===1) keys.left=false;
  if (e.key==="ArrowRight"||e.key==="/"||e.key==="m"||e.key==="M"||e.key==="Shift"&&e.location===2) keys.right=false;
});
document.getElementById("overlay").addEventListener("pointerdown",e=>{e.stopPropagation(); start();});
function touches(e){
  keys.left=keys.right=false;
  for (const t of e.touches){ if (t.clientX<innerWidth/2) keys.left=true; else keys.right=true; }
  e.preventDefault();
}
cv.addEventListener("touchstart",touches,{passive:false});
cv.addEventListener("touchend",touches,{passive:false});
cv.addEventListener("touchcancel",touches,{passive:false});
cv.addEventListener("mousedown",e=>{ if(e.clientX<innerWidth/2) keys.left=true; else keys.right=true; });
addEventListener("mouseup",()=>{ keys.left=keys.right=false; });

newGame(); started=false;
requestAnimationFrame(frame);
</script>
</body>
</html>
